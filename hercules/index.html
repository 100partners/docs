<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Protected Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

        <style>
            :root {
                --bg: #f6f5f1;
                --ink: #0f0f0f;
                --muted: #8a8a85;
                --soft: #d9d8d2;
                --white: #fff;
                --accent: #db4a2b;
            }
            * { box-sizing: border-box; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-content {
                height: 100%;
                background: var(--bg);
                color: var(--ink);
                font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .staticrypt-page { width: 100%; max-width: 430px; margin: 0 auto; padding: 13vh 24px 0; }
            .sc-mast {
                display: flex; justify-content: space-between; align-items: flex-end;
                border-bottom: 1px solid var(--ink); padding-bottom: 12px; margin-bottom: 26px;
            }
            .sc-mast .logo { font-weight: 600; font-size: 21px; color: var(--accent); letter-spacing: -0.01em; }
            .sc-mast .lbl { font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted); text-transform: lowercase; }
            .staticrypt-form { background: var(--white); border: 1px solid var(--ink); padding: 30px 26px; text-align: left; }
            .staticrypt-instructions { margin: 0 0 18px; }
            .staticrypt-title { font-size: 16px; font-weight: 600; margin: 0 0 6px; text-transform: lowercase; letter-spacing: -0.01em; }
            .staticrypt-instructions p:last-child { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0; text-transform: lowercase; }
            .staticrypt-hr { display: none; }
            .staticrypt-password-container { position: relative; background: var(--bg); border: 1px solid var(--soft); margin: 0 0 14px; }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: inherit; border: 0; outline: 0; font-family: inherit; font-size: 14px;
                color: var(--ink); padding: 14px 40px 14px 14px; width: 100%;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 18px; width: 18px; opacity: 0.5; padding: 13px;
                position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            }
            .staticrypt-form .staticrypt-decrypt-button {
                font-family: inherit; text-transform: lowercase; letter-spacing: 0.06em; outline: 0;
                background: var(--ink); width: 100%; border: 1px solid var(--ink); padding: 13px;
                color: var(--bg); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.1s, border-color 0.1s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus { background: var(--accent); border-color: var(--accent); }
            label.staticrypt-remember { display: flex; align-items: center; font-size: 11.5px; color: var(--muted); margin-bottom: 14px; text-transform: lowercase; }
            .staticrypt-remember input[type="checkbox"] { accent-color: var(--accent); transform: scale(1.2); margin-right: 10px; }
            .sc-foot { margin-top: 18px; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); text-transform: lowercase; }
            .sc-foot::before { content: "// "; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg); }
            .staticrypt-spinner {
                display: inline-block; width: 1.4rem; height: 1.4rem;
                border: 2px solid var(--soft); border-right-color: var(--accent); border-radius: 50%;
                animation: sc-spin 0.75s linear infinite;
            }
            @keyframes sc-spin { 100% { transform: rotate(360deg); } }
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }
        </style>
    </head>

                    </form>

                </div>
            </div>
