<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
<head>
    <meta charset="utf-8" />
    <title>Dub // 10 ideas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root{
            --accent:#DB4A2B; --bg:#f6f5f1; --green:#3f7a5e; --ink:#0f0f0f;
            --muted:#5f5f5a; --soft:#d9d8d2; --white:#ffffff;
        }
        *{box-sizing:border-box}
        .staticrypt-html,.staticrypt-body{height:100%}
        .staticrypt-body{
            margin:0;background:var(--bg);color:var(--ink);
            font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
            font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
        }
        .hidden{display:none!important}
        .staticrypt-content{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
        .staticrypt-page{width:100%;max-width:420px}
        .staticrypt-form{
            background:var(--white);border:1px solid var(--soft);border-radius:2px;padding:34px 32px 30px;
        }
        .sc-eyebrow{
            font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
            margin-bottom:16px;
        }
        .staticrypt-title{
            font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;line-height:1.25;
        }
        .staticrypt-instructions p:not(.staticrypt-title){
            margin:0;color:var(--muted);font-size:12.5px;
        }
        .staticrypt-hr{border:none;border-top:1px solid var(--soft);margin:22px 0}
        .staticrypt-password-container{position:relative;display:flex;align-items:center}
        .staticrypt-form input[type="password"],
        .staticrypt-form input[type="text"]{
            width:100%;padding:11px 42px 11px 13px;border:1px solid var(--soft);border-radius:2px;
            background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;
        }
        .staticrypt-form input[type="password"]:focus,
        .staticrypt-form input[type="text"]:focus{outline:none;border-color:var(--accent);background:var(--white)}
        .staticrypt-form input::placeholder{color:var(--muted);opacity:.7}
        .staticrypt-toggle-password-visibility{
            position:absolute;right:12px;width:17px;height:17px;cursor:pointer;opacity:.4;
        }
        .staticrypt-toggle-password-visibility:hover{opacity:.85}
        label.staticrypt-remember{
            display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);
            font-size:11px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;
        }
        .staticrypt-remember input[type="checkbox"]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
        .staticrypt-form .staticrypt-decrypt-button{
            width:100%;margin-top:20px;padding:12px 16px;border:1px solid var(--accent);border-radius:2px;
            background:var(--accent);color:#fff;font-family:inherit;font-size:11.5px;font-weight:600;
            text-transform:uppercase;letter-spacing:.1em;cursor:pointer;transition:background .15s,color .15s;
        }
        .staticrypt-form .staticrypt-decrypt-button:hover,
        .staticrypt-form .staticrypt-decrypt-button:active,
        .staticrypt-form .staticrypt-decrypt-button:focus{background:var(--ink);border-color:var(--ink);color:var(--bg)}
        .sc-foot{margin-top:18px;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
        .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
        .staticrypt-spinner{
            width:26px;height:26px;border:2px solid var(--soft);border-top-color:var(--accent);
            border-radius:50%;animation:sc-spin .7s linear infinite;
        }
        @keyframes sc-spin{to{transform:rotate(360deg)}}
        @media(max-width:480px){.staticrypt-form{padding:26px 22px}.staticrypt-title{font-size:19px}}
    </style>
</head>
