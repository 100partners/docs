<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>100 partners × sphere rocket</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="icon" type="image/png" href="https://100.partners/assets/100p-logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

        <style>
            :root {
                --bg: #f6f5f1;
                --ink: #0f0f0f;
                --muted: #8a8a85;
                --soft: #d9d8d2;
                --white: #ffffff;
                --accent: #DB4A2B;
            }

            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }

            .staticrypt-content {
                height: 100%;
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 420px;
                padding: 0 24px;
                margin: auto;
                box-sizing: border-box;
                min-height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-brand {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 26px;
                text-transform: lowercase;
                letter-spacing: -0.01em;
            }
            .staticrypt-brand img { height: 44px; width: auto; display: block; }
            .staticrypt-brand .sr-logo { height: 30px; width: auto; display: block; }
            .staticrypt-brand .x { color: var(--muted); font-size: 16px; }
            .staticrypt-brand .singu {
                font-size: 19px; font-weight: 600; color: var(--ink);
                display: flex; align-items: center; gap: 7px;
            }
            .staticrypt-brand .singu svg { width: 17px; height: 17px; }
            .staticrypt-brand .singu .d { fill: #3b5bfd; }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--white);
                width: 100%;
                box-sizing: border-box;
                border: 1px solid var(--ink);
                padding: 34px 30px;
                text-align: left;
            }

            .staticrypt-instructions { margin: 0 0 4px; }
            .staticrypt-title {
                font-size: 17px; font-weight: 600; margin: 0 0 8px;
                text-transform: lowercase; letter-spacing: -0.01em;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0;
            }

            .staticrypt-hr {
                margin: 18px 0;
                border: 0;
                border-top: 1px solid var(--soft);
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--bg);
                width: 100%;
                border: 1px solid var(--soft);
                margin: 0 0 14px;
                box-sizing: border-box;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-family: inherit;
                font-size: 14px;
                outline: 0;
                padding: 14px 38px 14px 14px;
                width: 100%;
                color: var(--ink);
            }
            .staticrypt-form input::placeholder { color: var(--muted); }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 55%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: inherit;
                text-transform: lowercase;
                letter-spacing: 0.08em;
                outline: 0;
                background: var(--accent);
                width: 100%;
                border: 1px solid var(--accent);
                padding: 14px;
                color: var(--white);
                font-size: 13px;
                cursor: pointer;
                transition: background 0.12s, color 0.12s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--ink);
                color: var(--bg);
                border-color: var(--ink);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 14px;
                font-size: 12px;
                color: var(--muted);
                text-transform: lowercase;
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.2);
                margin-right: 0.8em;
                accent-color: var(--accent);
            }

            .staticrypt-footnote {
                margin: 18px 0 0;
                font-size: 10.5px;
                letter-spacing: 0.05em;
                color: var(--muted);
                text-transform: lowercase;
                text-align: center;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid var(--soft);
                border-right-color: var(--accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }
        </style>
    </head>
