<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex, nofollow" />
        <title>signal campaign playbook</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

        <style>
            :root {
                --bg: #f6f5f1;
                --ink: #0f0f0f;
                --orange: #DB4A2B;
                --muted: #6b6b66;
                --line: #dedcd4;
                --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--mono);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                /* subtle grid texture, brand-consistent */
                background-image:
                    linear-gradient(rgba(15,15,15,0.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(15,15,15,0.025) 1px, transparent 1px);
                background-size: 28px 28px;
            }

            .staticrypt-page {
                width: 420px;
                max-width: 92vw;
                padding: 12vh 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-wordmark {
                font-size: 20px;
                font-weight: 700;
                letter-spacing: -0.03em;
                margin-bottom: 22px;
                text-align: left;
            }
            .staticrypt-wordmark .dot { color: var(--orange); }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                margin: 0 auto;
                padding: 32px 30px 30px;
                text-align: left;
                border: 1px solid var(--ink);
                border-radius: 0;
                box-shadow: none;
            }

            .staticrypt-instructions { margin: 0 0 4px; }

            .staticrypt-title {
                font-size: 14px;
                font-weight: 700;
                margin: 0 0 6px;
                color: var(--ink);
                text-transform: lowercase;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 12px;
                color: var(--muted);
                margin: 0;
                line-height: 1.5;
            }

            .staticrypt-hr {
                margin: 18px 0;
                border: 0;
                border-top: 1px dashed var(--line);
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--bg);
                width: 100%;
                border: 1px solid var(--line);
                margin: 0 0 14px;
                box-sizing: border-box;
            }
            .staticrypt-password-container:focus-within { border-color: var(--orange); }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-family: var(--mono);
                font-size: 14px;
                color: var(--ink);
                outline: 0;
                padding: 14px 38px 14px 14px;
                width: 100%;
            }
            .staticrypt-form input::placeholder { color: var(--muted); }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 0.5;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: lowercase;
                font-family: var(--mono);
                font-weight: 700;
                letter-spacing: 0.02em;
                outline: 0;
                background: var(--orange);
                width: 100%;
                border: 0;
                border-radius: 0;
                padding: 14px;
                color: var(--bg);
                font-size: 13px;
                cursor: pointer;
                transition: filter 0.15s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--orange);
                filter: brightness(92%);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 14px;
                font-size: 11px;
                color: var(--muted);
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 12px;
                accent-color: var(--orange);
            }

            .staticrypt-footer {
                margin-top: 16px;
                font-size: 10.5px;
                color: var(--muted);
                text-align: left;
                line-height: 1.5;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--line);
                border-right-color: var(--orange);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }
        </style>
    </head>
