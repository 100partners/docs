<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <title>// this page is private</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root{--bg:#f6f5f1;--ink:#0f0f0f;--muted:#8a8a85;--soft:#d9d8d2;--white:#ffffff;--accent:#DB4A2B;}
            *{box-sizing:border-box;}
            .staticrypt-html,.staticrypt-body{height:100%;margin:0;}
            .staticrypt-content{height:100%;margin:0;background:var(--bg);color:var(--ink);
                font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-font-smoothing:antialiased;}
            ::selection{background:var(--accent);color:var(--bg);}
            .staticrypt-page{width:420px;max-width:92%;padding:9% 0 0;margin:auto;}
            .brand-logo{display:block;height:46px;width:auto;margin:0 auto 26px;}
            .staticrypt-form{position:relative;z-index:1;background:var(--white);border:1px solid var(--ink);
                max-width:420px;margin:0 auto 24px;padding:34px 32px;text-align:center;box-shadow:none;}
            .staticrypt-instructions{margin:0 0 4px;}
            .staticrypt-title{font-size:16px;font-weight:600;letter-spacing:0.02em;text-transform:lowercase;margin:0 0 8px;color:var(--ink);}
            .staticrypt-instructions p:last-child{font-size:12px;line-height:1.6;color:var(--muted);margin:0;}
            .staticrypt-hr{margin:20px 0;border:0;border-top:1px solid var(--soft);}
            .staticrypt-password-container{position:relative;background:var(--bg);border:1px solid var(--ink);width:100%;margin:0 0 14px;}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:inherit;border:0;
                font-family:inherit;font-size:14px;outline:0;padding:14px 42px 14px 14px;width:100%;color:var(--ink);}
            .staticrypt-form input::placeholder{color:var(--muted);text-transform:lowercase;}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:18px;width:18px;opacity:.5;padding:13px;
                position:absolute;right:0;top:50%;transform:translateY(-50%);}
            .staticrypt-form .staticrypt-decrypt-button{font-family:inherit;text-transform:lowercase;letter-spacing:0.08em;
                outline:0;background:var(--ink);width:100%;border:1px solid var(--ink);padding:14px;color:var(--bg);
                font-size:13px;cursor:pointer;transition:background .15s ease,color .15s ease;}
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus{background:var(--accent);border-color:var(--accent);color:var(--bg);}
            label.staticrypt-remember{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 16px;
                font-size:11px;letter-spacing:0.04em;text-transform:lowercase;color:var(--muted);cursor:pointer;}
            .staticrypt-remember input[type="checkbox"]{transform:scale(1.2);accent-color:var(--accent);margin:0;}
            .brand-foot{text-align:center;font-size:10px;letter-spacing:0.08em;text-transform:lowercase;color:var(--muted);}
            .brand-foot b{color:var(--ink);font-weight:600;}
            .hidden{display:none !important;}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;}
            .staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:0.22em solid var(--soft);
                border-right-color:var(--accent);border-radius:50%;animation:spinner-border .75s linear infinite;}
            @keyframes spinner-border{100%{transform:rotate(360deg);}}
            @media screen and (-webkit-min-device-pixel-ratio:0){
                .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{font-size:16px;}}
        </style>
    </head>

                    </form>
                </div>
                <div class="brand-foot">// <b>100 partners</b> &times; dub &middot; private</div>
            </div>
        </div>
